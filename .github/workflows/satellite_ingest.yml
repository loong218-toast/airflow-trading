name: satellite-ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: satellite-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow polars

      - name: Run satellite ingest
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_DATA_CHANNEL_ID: ${{ secrets.TG_DATA_CHANNEL_ID }}
          PYTHONPATH: ${{ github.workspace }}/dags
        run: |
          python satellite_ingest.py

      - name: Commit updated universe state
        if: success()
        run: |
          if git diff --quiet -- selected_universe.json; then
            echo "No universe changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add selected_universe.json
          git commit -m "Update satellite universe state"
          git push